<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03070C">
<title>Annonces de la ville — Terra Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/nova.css">
</head>
<body data-page="annonces">

<!-- D06 : retrouver facilement les publications de la ville et consulter leur contenu -->
<main id="contenu">
  <header class="tete-page">
    <img src="assets/terra-nova/backgrounds/planete-horizon.svg" width="990" height="420" alt="">
    <div class="contenu">
      <h1>Annonces de la ville</h1>
      <p>Annonces municipales, changements de service et informations pratiques publiés par la mairie.</p>
    </div>
  </header>

  <div class="outils">
    <div class="puces-filtre" role="group" aria-label="Filtrer par type d’annonce">
      <span class="curseur" aria-hidden="true"></span>
      <button type="button" data-filtre="tout" aria-pressed="true">Toutes</button>
      <button type="button" data-filtre="municipale" aria-pressed="false">Municipales</button>
      <button type="button" data-filtre="changement" aria-pressed="false">Changements de service</button>
      <button type="button" data-filtre="pratique" aria-pressed="false">Pratiques</button>
    </div>
  </div>

  <div class="annonces" data-annonces></div>
  <div class="vide" role="status"><strong>Aucune annonce dans cette catégorie</strong>Les nouvelles publications apparaîtront ici.</div>
</main>

<script src="assets/js/donnees.js"></script>
<script src="assets/js/nova.js"></script>
</body>
</html>
