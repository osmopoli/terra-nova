<!doctype html>
<html lang="fr" class="sl-theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rechercher — Terra Nova</title>
  <meta name="description" content="Recherche dans les services, démarches, réponses, annonces et associations de Terra Nova, même avec des fautes ou dans une autre langue.">
  <meta name="theme-color" content="#0b1a1c">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" id="nt-polices" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="if(!document.documentElement.classList.contains('leger'))this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
  <link rel="stylesheet" href="assets/css/icones.css"><!-- vague 19 (F95) : icônes utilisées seulement (tools/icones.js) -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/orientation.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/recherche.js" defer></script>
</head>
<body data-page="recherche" data-ariane="nav.accueil|index.html;rc.titre">
  <main id="contenu" class="conteneur" style="max-width:52rem">
    <header class="titre-page">
      <h1 data-i18n="rc.titre">Rechercher</h1>
      <p data-i18n="rc.sous">Services, démarches, réponses, annonces et associations : écrivez avec vos mots, même avec des fautes ou dans une autre langue.</p>
    </header>
    <form role="search" id="rc-form" action="recherche.html">
      <label for="rc-q" class="sr-only" data-i18n="rc.label">Que cherchez-vous ?</label>
      <div class="or-champ"><i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <input id="rc-q" name="q" type="search" autocomplete="off" enterkeyhint="search" maxlength="200" data-i18n-attr="placeholder:rc.ph" placeholder="Ex. : ma poubelle déborde, papier pour me marier…">
        <button class="btn btn-primaire" type="submit"><span data-i18n="rc.chercher">Rechercher</span></button></div>
    </form>
    <div id="rc-resultats" data-or-champ="rc-q" style="margin-top:1.2rem"></div>
  </main>
</body>
</html>
