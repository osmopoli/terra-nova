<!doctype html>
<html lang="fr" class="sl-theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérifier un accusé de réception — Terra Nova</title>
  <meta name="description" content="Vérifiez qu’un accusé de réception de Terra Nova est authentique, avec sa référence et son code, sans aucune donnée personnelle.">
  <meta name="theme-color" content="#0b1a1c">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" id="nt-polices" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="if(!document.documentElement.classList.contains('leger'))this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css"></noscript>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"></noscript>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css"></noscript>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/informations.css">
  <link rel="stylesheet" href="assets/css/vague16.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/accuse.js"></script>
  <script src="assets/js/ui.js" defer></script>
</head>
<body data-page="verifier-accuse" data-ariane="nav.accueil|index.html;acc.vTitre">
  <main id="contenu" class="conteneur tn-etroit">
    <header class="titre-page">
      <h1 data-i18n="acc.vTitre">Vérifier un accusé de réception</h1>
      <p data-i18n="acc.vSous">Vous avez reçu un accusé de réception de Terra Nova ? Saisissez sa référence et son code pour vérifier qu’il est authentique.</p>
    </header>
    <section class="panneau info-bloc">
      <form id="form-verifier" novalidate data-tn-libre>
        <div class="grille-2">
          <div class="champ">
            <label for="v-ref" data-i18n="acc.vRef">Référence de la demande</label>
            <input id="v-ref" type="text" dir="ltr" autocomplete="off" spellcheck="false" maxlength="12" aria-describedby="aide-v-ref err-v-ref">
            <p class="aide" id="aide-v-ref" data-i18n="acc.vRefAide">Exemple : NT-1041</p>
            <p class="erreur" id="err-v-ref" hidden></p>
          </div>
          <div class="champ">
            <label for="v-code" data-i18n="acc.vCode">Code de vérification</label>
            <input id="v-code" type="text" dir="ltr" autocomplete="off" spellcheck="false" maxlength="12" autocapitalize="characters" aria-describedby="aide-v-code err-v-code">
            <p class="aide" id="aide-v-code" data-i18n="acc.vCodeAide">8 caractères, avec ou sans tiret. Exemple : K7PM-Q2XD</p>
            <p class="erreur" id="err-v-code" hidden></p>
          </div>
        </div>
        <button class="btn btn-primaire" type="submit"><i class="ph ph-seal-check" aria-hidden="true"></i><span data-i18n="acc.vBouton">Vérifier</span></button>
      </form>
    </section>
    <div id="resultat" aria-live="polite"></div>
  </main>
</body>
</html>
