<!doctype html>
<html lang="fr" class="sl-theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivi de mes demandes — Terra Nova</title>
  <meta name="description" content="Suivez vos demandes à la mairie de Terra Nova : statut, étapes réalisées et historique.">
  <meta name="theme-color" content="#0b1a1c">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" id="nt-polices" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="if(!document.documentElement.classList.contains('leger'))this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css"></noscript>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"></noscript>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css"></noscript>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/demandes.css">
  <link rel="stylesheet" href="assets/css/vague16.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/avis-service.js"></script>
  <script src="assets/js/formulaires.js"></script>
  <script src="assets/js/accuse.js"></script>
  <script src="assets/js/echanges.js"></script>
  <script src="assets/js/sujets.js"></script>
  <link rel="stylesheet" href="assets/css/vague17.css"><!-- vague 17 (F86) : écran urgence médicale -->
  <script src="assets/js/urgence-medicale.js"></script>
  <script src="assets/js/ui.js" defer></script>
</head>
<body data-page="espace" data-ariane="nav.accueil|index.html;nav.espace|espace.html;suivi.ariane" data-roles="connecte">
  <main id="contenu" class="conteneur">
    <header class="titre-page">
      <h1 id="titre-suivi" data-i18n="suivi.titre">Suivi de mes demandes</h1>
      <p id="intro-suivi" data-i18n="suivi.intro">Retrouvez l’état de chaque demande et les étapes déjà réalisées, sans contacter la mairie.</p>
    </header>
    <div id="contenu-suivi"></div>
  </main>

  <script>
    NT.i18n.ajouter({
      fr: { 'suivi.ariane': 'Suivi de la demande' },
      en: { 'suivi.ariane': 'Request tracking', 'suivi.titre': 'Tracking my requests', 'suivi.intro': 'See the status of each request and the steps already completed, without contacting the city hall.' },
      es: { 'suivi.ariane': 'Seguimiento de la solicitud', 'suivi.titre': 'Seguimiento de mis solicitudes', 'suivi.intro': 'Consulte el estado de cada solicitud y las etapas ya realizadas, sin contactar con el ayuntamiento.' },
      ar: { 'suivi.ariane': 'متابعة الطلب', 'suivi.titre': 'متابعة طلباتي', 'suivi.intro': 'اطلع على حالة كل طلب والخطوات المنجزة، دون الاتصال بالبلدية.' }
    });
    /* Textes du script ci-dessous (bi(fr, en)) : traductions ES et AR indexées par le texte FR */
    const TX = {
      es: {
        'Reçue': 'Recibida', 'En cours': 'En curso', 'Traitée': 'Resuelta', 'Clôturée': 'Cerrada', 'Contact': 'Contacto', 'Signalement': 'Aviso', 'Démarche': 'Trámite',
        'Service à déterminer': 'Servicio por determinar', 'à': 'a las',
        'Les agents consultent les demandes dans l’espace de travail.': 'Los agentes consultan las solicitudes en el espacio de trabajo.', 'Ouvrir les demandes': 'Abrir las solicitudes',
        'Mes demandes': 'Mis solicitudes', 'Nouvelle demande': 'Nueva solicitud', 'Télécharger le récapitulatif': 'Descargar el resumen', 'Vous n’avez pas encore fait de demande.': 'Todavía no ha hecho ninguna solicitud.',
        'Accès refusé': 'Acceso denegado', 'Vous ne pouvez consulter que vos propres demandes.': 'Solo puede consultar sus propias solicitudes.', 'Retour à mon espace': 'Volver a mi espacio',
        'Demande introuvable': 'Solicitud no encontrada', 'Aucune demande ne correspond à ce numéro.': 'Ninguna solicitud corresponde a este número.', 'Voir mes demandes': 'Ver mis solicitudes', 'Retour aux demandes': 'Volver a las solicitudes',
        'Demande ': 'Solicitud ', 'Statut actuel, étapes réalisées et historique de votre demande.': 'Estado actual, etapas realizadas e historial de su solicitud.', 'Statut actuel : ': 'Estado actual: ',
        'Toutes mes demandes': 'Todas mis solicitudes', 'Avancement': 'Avance', 'Étapes de la demande': 'Etapas de la solicitud', 'Étape réalisée': 'Etapa realizada', 'Étape actuelle': 'Etapa actual', 'À venir': 'Pendiente',
        'Détails': 'Detalles', 'Type': 'Tipo', 'Service': 'Servicio', 'Envoyée le': 'Enviada el', 'Lieu': 'Lugar', 'Priorité': 'Prioridad', 'Haute (dangereux)': 'Alta (peligroso)', 'Normale': 'Normal',
        'Traitée par': 'Tramitada por', 'Pas encore attribuée à un agent': 'Aún no asignada a un agente', 'Photo': 'Foto', 'Photo jointe au signalement': 'Foto adjunta al aviso', 'Changement de statut': 'Cambio de estado',
        'Ajouter un complément d’information': 'Añadir información complementaria', 'Il sera ajouté à l’historique et visible par l’agent qui traite votre demande.': 'Se añadirá al historial y lo verá el agente que tramita su solicitud.',
        'Votre complément': 'Su información complementaria', 'Envoyer le complément': 'Enviar la información', 'Écrivez votre complément (5 caractères minimum).': 'Escriba su información complementaria (5 caracteres como mínimo).',
        'Complément ajouté à votre demande.': 'Información añadida a su solicitud.', 'Cette demande est clôturée : pour une nouvelle question, faites une nouvelle demande.': 'Esta solicitud está cerrada: para una nueva pregunta, haga una nueva solicitud.'
      },
      ar: {
        'Reçue': 'مستلم', 'En cours': 'قيد المعالجة', 'Traitée': 'تمت معالجته', 'Clôturée': 'مغلق', 'Contact': 'اتصال', 'Signalement': 'بلاغ', 'Démarche': 'إجراء',
        'Service à déterminer': 'مصلحة تُحدد لاحقاً', 'à': 'الساعة',
        'Les agents consultent les demandes dans l’espace de travail.': 'يطّلع الأعوان على الطلبات في فضاء العمل.', 'Ouvrir les demandes': 'فتح الطلبات',
        'Mes demandes': 'طلباتي', 'Nouvelle demande': 'طلب جديد', 'Télécharger le récapitulatif': 'تنزيل الملخص', 'Vous n’avez pas encore fait de demande.': 'لم تقدم أي طلب بعد.',
        'Accès refusé': 'الوصول مرفوض', 'Vous ne pouvez consulter que vos propres demandes.': 'لا يمكنك الاطلاع إلا على طلباتك الخاصة.', 'Retour à mon espace': 'العودة إلى فضائي',
        'Demande introuvable': 'الطلب غير موجود', 'Aucune demande ne correspond à ce numéro.': 'لا يوجد طلب يطابق هذا الرقم.', 'Voir mes demandes': 'عرض طلباتي', 'Retour aux demandes': 'العودة إلى الطلبات',
        'Demande ': 'الطلب ', 'Statut actuel, étapes réalisées et historique de votre demande.': 'الحالة الحالية والخطوات المنجزة وسجل طلبك.', 'Statut actuel : ': 'الحالة الحالية: ',
        'Toutes mes demandes': 'جميع طلباتي', 'Avancement': 'التقدم', 'Étapes de la demande': 'خطوات الطلب', 'Étape réalisée': 'خطوة منجزة', 'Étape actuelle': 'الخطوة الحالية', 'À venir': 'قادمة',
        'Détails': 'التفاصيل', 'Type': 'النوع', 'Service': 'المصلحة', 'Envoyée le': 'أُرسل في', 'Lieu': 'المكان', 'Priorité': 'الأولوية', 'Haute (dangereux)': 'عالية (خطر)', 'Normale': 'عادية',
        'Traitée par': 'يعالجه', 'Pas encore attribuée à un agent': 'لم يُسند إلى عون بعد', 'Photo': 'صورة', 'Photo jointe au signalement': 'صورة مرفقة بالبلاغ', 'Changement de statut': 'تغيير الحالة',
        'Ajouter un complément d’information': 'إضافة معلومات تكميلية', 'Il sera ajouté à l’historique et visible par l’agent qui traite votre demande.': 'سيُضاف إلى السجل وسيراه العون الذي يعالج طلبك.',
        'Votre complément': 'معلوماتك التكميلية', 'Envoyer le complément': 'إرسال المعلومات', 'Écrivez votre complément (5 caractères minimum).': 'اكتب معلوماتك التكميلية (5 أحرف على الأقل).',
        'Complément ajouté à votre demande.': 'أُضيفت المعلومات إلى طلبك.', 'Cette demande est clôturée : pour une nouvelle question, faites une nouvelle demande.': 'هذا الطلب مغلق: لسؤال جديد، قدّم طلباً جديداً.'
      }
    };
    // F75 : demande regroupée avec d'autres signalements du même problème
    NT.i18n.ajouter({
      fr: { 'sg.rattachee': 'D’autres habitants ont signalé le même problème : votre demande est traitée avec la demande {id}. Vous recevez les mêmes réponses, sans rien refaire.', 'sg.principale': '{n} autre(s) habitant(s) ont signalé le même problème : une seule réponse pour tous, chacun est prévenu.' },
      en: { 'sg.rattachee': 'Other residents reported the same problem: your request is handled together with request {id}. You get the same replies, with nothing to redo.', 'sg.principale': '{n} other resident(s) reported the same problem: one reply for all, everyone is notified.' },
      es: { 'sg.rattachee': 'Otros habitantes señalaron el mismo problema: su solicitud se trata junto con la solicitud {id}. Recibe las mismas respuestas, sin rehacer nada.', 'sg.principale': '{n} habitante(s) más señalaron el mismo problema: una sola respuesta para todos, cada uno recibe aviso.' },
      ar: { 'sg.rattachee': 'أبلغ سكان آخرون عن المشكلة نفسها: يُعالج طلبك مع الطلب {id}. تتلقى الردود نفسها دون إعادة أي شيء.', 'sg.principale': 'أبلغ {n} ساكن(ون) آخرون عن المشكلة نفسها: رد واحد للجميع، ويتم إعلام كل واحد.' }
    });

    NT.pret(() => {
      const { echap, $ } = NT.ui;
      const bi = (fr, en) => ({ fr, en, es: TX.es[fr], ar: TX.ar[fr] }[NT.i18n.langue] || en);
      const u = NT.auth.utilisateur();
      const zone = $('#contenu-suivi');
      const id = NT.ui.param('id');
      const estAgent = u.role !== 'citoyen';
      const ETAPES = ['recue', 'en_cours', 'traitee', 'cloturee'];
      const ICONES = { recue: 'ph-envelope-simple-open', en_cours: 'ph-gear-six', traitee: 'ph-check-circle', cloturee: 'ph-lock-simple' };
      const LIB = { recue: ['Reçue', 'Received'], en_cours: ['En cours', 'In progress'], traitee: ['Traitée', 'Resolved'], cloturee: ['Clôturée', 'Closed'] };
      const TYPES = { contact: ['Contact', 'Contact'], signalement: ['Signalement', 'Problem report'], demarche: ['Démarche', 'Procedure'] };
      const lib = c => bi(LIB[c][0], LIB[c][1]);
      const nomService = sid => { const s = NT.services.get(sid); return s ? NT.i18n.choisir(s.nom) : bi('Service à déterminer', 'Service to be determined'); };
      const badge = c => `<span class="statut statut-${echap(c)}"><i class="ph-duotone ${ICONES[c] || 'ph-circle'}" aria-hidden="true"></i>${echap(lib(c))}</span>`;
      const dateLongue = iso => NT.ui.date(iso) + ' ' + bi('à', 'at') + ' ' + new Date(iso).toLocaleTimeString(NT.i18n.langue === 'fr' ? 'fr-FR' : 'en-GB', { hour: '2-digit', minute: '2-digit' });

      /* ----- Sans identifiant : la liste de mes demandes ----- */
      function liste() {
        if (estAgent) {
          zone.innerHTML = `<div class="vide"><p>${echap(bi('Les agents consultent les demandes dans l’espace de travail.', 'Staff members view requests in the work area.'))}</p>
            <a class="btn btn-primaire" href="agent-demandes.html">${echap(bi('Ouvrir les demandes', 'Open the requests'))}</a></div>`;
          return;
        }
        const l = NT.demandes.pour(u.id);
        zone.innerHTML = `<div class="ligne entre" style="margin-bottom:1rem"><h2 style="margin:0">${echap(bi('Mes demandes', 'My requests'))} (${l.length})</h2>
            <span class="ligne"><a class="btn btn-primaire" href="demande.html"><i class="ph ph-plus" aria-hidden="true"></i>${echap(bi('Nouvelle demande', 'New request'))}</a>
            <a class="btn" href="recapitulatif.html"><i class="ph ph-file-arrow-down" aria-hidden="true"></i>${echap(bi('Télécharger le récapitulatif', 'Download the summary'))}</a>
            <a class="btn" href="espace.html">${echap(bi('Retour à mon espace', 'Back to my space'))}</a></span></div>` +
          (l.length ? `<div id="suivi-outils"></div><ul class="dm-liste-demandes" id="suivi-liste"></ul>`
            : `<p class="vide">${echap(bi('Vous n’avez pas encore fait de demande.', 'You have not made any request yet.'))}</p>`);
        if (!l.length) return;
        // F79 : trier et filtrer mes demandes par sujet (service), état et mot-clé ; état gardé dans l'adresse
        const ligne = d => `<li><a href="suivi.html?id=${encodeURIComponent(d.id)}">
              <span><span class="ref">${echap(d.id)}</span><strong>${echap(d.objet)}</strong>
              <span class="meta" style="display:block">${echap(bi(TYPES[d.type][0], TYPES[d.type][1]))} · ${echap(nomService(d.serviceId))} · ${echap(NT.ui.date(d.cree))}</span></span>
              ${badge(d.statut)}</a></li>`;
        NT.sujets.monter({ conteneur: $('#suivi-outils'), statuts: true, elements: () => l, sujetDe: d => d.serviceId || '', statutDe: d => d.statut, dateDe: d => d.cree,
          texteDe: d => [d.id, d.objet, d.message, d.lieu, nomService(d.serviceId)].join(' '),
          onChange: r => { $('#suivi-liste').innerHTML = r.length ? r.map(ligne).join('') : `<li class="vide">${echap(NT.t('sj.aucun'))}</li>`; } });
      }

      /* ----- Détail d'une demande ----- */
      function detail(d) {
        const idx = ETAPES.indexOf(d.statut);
        const histo = Array.isArray(d.historique) ? d.historique : [];
        const frise = ETAPES.map((e, i) => {
          const faite = i <= idx, courante = i === idx;
          const items = histo.filter(h => h.statut === e);
          const etat = courante ? bi('Étape actuelle', 'Current step') : faite ? bi('Étape réalisée', 'Step completed') : bi('À venir', 'Upcoming');
          const ic = faite ? 'ph-check-circle' : 'ph-circle-dashed';
          return `<li class="${faite ? 'faite' : ''} ${courante ? 'courante' : ''}" ${courante ? 'aria-current="step"' : ''}>
            <div class="dm-etape-titre"><strong>${echap(lib(e))}</strong><span class="dm-etape-etat"><i class="ph-duotone ${ic}" aria-hidden="true"></i>${echap(etat)}</span></div>
            ${items.length ? `<ul class="dm-hist">${items.map(h => `<li class="${/^Complément du citoyen/.test(h.note || '') ? 'complement' : ''}">
              <time datetime="${echap(h.date)}">${echap(dateLongue(h.date))}</time>
              <p style="margin:.15rem 0">${echap(h.note || bi('Changement de statut', 'Status change'))}</p>
              <span class="par"><i class="ph ph-user" aria-hidden="true"></i> ${echap(h.par || '')}</span></li>`).join('')}</ul>` : ''}
          </li>`;
        }).join('');

        const haute = d.priorite === 'haute';
        const peutCompleter = d.statut !== 'cloturee' && (!estAgent ? true : false);
        zone.innerHTML = `
          <div class="ligne" style="margin-bottom:1rem"><a class="btn" href="suivi.html"><i class="ph ph-arrow-left" aria-hidden="true"></i>${echap(bi('Toutes mes demandes', 'All my requests'))}</a></div>
          <div class="dm-suivi">
            <div>
              <section class="panneau dm-panneau" aria-labelledby="h-objet">
                <div class="dm-entete-demande">
                  <div><span class="ref">${echap(d.id)}</span><h2 id="h-objet">${echap(d.objet)}</h2></div>
                  <span class="dm-statut-grand statut-${echap(d.statut)}"><i class="ph-duotone ${ICONES[d.statut]}" aria-hidden="true"></i><span><span class="sr-only">${echap(bi('Statut actuel : ', 'Current status: '))}</span>${echap(lib(d.statut))}</span></span>
                </div>
                ${d.message ? `<p style="white-space:pre-line">${echap(d.message)}</p>` : ''}
                ${d.principale ? `<p class="sg-note"><i class="ph-duotone ph-stack" aria-hidden="true"></i><span>${echap(NT.t('sg.rattachee', { id: d.principale }))}</span></p>`
                  : (d.liees && d.liees.length ? `<p class="sg-note"><i class="ph-duotone ph-stack" aria-hidden="true"></i><span>${echap(NT.t('sg.principale', { n: d.liees.length }))}</span></p>` : '')}
                <h3 style="margin-top:1.5rem">${echap(bi('Avancement', 'Progress'))}</h3>
                <ol class="etapes dm-frise" aria-label="${echap(bi('Étapes de la demande', 'Request steps'))}">${frise}</ol>
              </section>
              ${peutCompleter ? `
              <section class="panneau dm-panneau" style="margin-top:1.5rem" aria-labelledby="h-compl">
                <h2 id="h-compl" style="font-size:1.2rem">${echap(bi('Ajouter un complément d’information', 'Add further information'))}</h2>
                <form id="form-compl" novalidate>
                  <div class="champ">
                    <label for="compl">${echap(bi('Votre complément', 'Your addition'))}</label>
                    <textarea id="compl" maxlength="1000" style="min-height:6rem" aria-describedby="aide-compl err-compl"></textarea>
                    <p class="aide" id="aide-compl">${echap(bi('Il sera ajouté à l’historique et visible par l’agent qui traite votre demande.', 'It will be added to the history and visible to the agent handling your request.'))}</p>
                    <p class="erreur dm-err" id="err-compl" hidden></p>
                  </div>
                  <button class="btn btn-primaire" type="submit"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>${echap(bi('Envoyer le complément', 'Send the addition'))}</button>
                </form>
              </section>` : (d.statut === 'cloturee' ? `<p class="doux" style="margin-top:1rem">${echap(bi('Cette demande est clôturée : pour une nouvelle question, faites une nouvelle demande.', 'This request is closed: for a new question, make a new request.'))}</p>` : '')}
              <div id="zone-avis-dem"></div>
            </div>
            <aside class="panneau dm-panneau" aria-labelledby="h-fiche">
              <h2 id="h-fiche" style="font-size:1.2rem">${echap(bi('Détails', 'Details'))}</h2>
              <dl class="dm-fiche">
                <dt>${echap(bi('Type', 'Type'))}</dt><dd>${echap(bi(TYPES[d.type][0], TYPES[d.type][1]))}</dd>
                <dt>${echap(bi('Service', 'Service'))}</dt><dd>${echap(nomService(d.serviceId))}</dd>
                ${d.lieu ? `<dt>${echap(bi('Lieu', 'Location'))}</dt><dd>${echap(d.lieu)}</dd>` : ''}
                <dt>${echap(bi('Envoyée le', 'Sent on'))}</dt><dd>${echap(dateLongue(d.cree))}</dd>
                <dt>${echap(bi('Priorité', 'Priority'))}</dt><dd>${haute ? `<span class="dm-prio-haute"><i class="ph-duotone ph-warning" aria-hidden="true"></i>${echap(bi('Haute (dangereux)', 'High (dangerous)'))}</span>` : echap(bi('Normale', 'Normal'))}</dd>
                <dt>${echap(bi('Traitée par', 'Handled by'))}</dt><dd>${d.agent ? `<i class="ph ph-user-circle" aria-hidden="true"></i> ${echap(d.agent)}` : `<span class="doux">${echap(bi('Pas encore attribuée à un agent', 'Not yet assigned to an agent'))}</span>`}</dd>
                ${d.photo ? `<dt>${echap(bi('Photo', 'Photo'))}</dt><dd><img src="${echap(d.photo)}" alt="${echap(bi('Photo jointe au signalement', 'Photo attached to the report'))}"></dd>` : ''}
              </dl>
            </aside>
          </div>`;
        const titre = $('#titre-suivi'); titre.textContent = bi('Demande ', 'Request ') + d.id;
        $('#intro-suivi').textContent = bi('Statut actuel, étapes réalisées et historique de votre demande.', 'Current status, completed steps and history of your request.');
        document.title = bi('Demande ', 'Request ') + d.id + ' — Terra Nova';
        if (NT.avisService) NT.avisService.panneauDemande($('#zone-avis-dem'), d);   // F76 : « Donner mon avis » sur une demande traitée
        if (NT.reponses) NT.reponses.suivi($('#zone-avis-dem'), d);   // F84 : échanges avec la mairie, répondre
        if (NT.accuse) NT.accuse.suivi($('#h-fiche').parentNode, d);   // F83 : accusé de réception

        const f = $('#form-compl');
        if (f) f.addEventListener('submit', e => {
          e.preventDefault();
          const champ = $('#compl'), err = $('#err-compl'), txt = champ.value.trim();
          if (txt.length < 5) {
            err.innerHTML = `<i class="ph ph-warning-circle" aria-hidden="true"></i><span>${echap(bi('Écrivez votre complément (5 caractères minimum).', 'Write your addition (5 characters minimum).'))}</span>`;
            err.hidden = false; champ.setAttribute('aria-invalid', 'true'); champ.focus(); return;
          }
          const nom = u.prenom + ' ' + u.nom;
          NT.store.update('demandes', d.id, x => ({ historique: (x.historique || []).concat([{ date: NT.store.maintenant(), statut: x.statut, note: 'Complément du citoyen : ' + txt, par: nom }]) }));
          NT.ui.toast(bi('Complément ajouté à votre demande.', 'Addition added to your request.'), 'success');
          detail(NT.store.find('demandes', d.id));
          const h = $('#h-compl'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
        });
        const c = $('#compl'); if (c) c.addEventListener('input', () => { c.removeAttribute('aria-invalid'); $('#err-compl').hidden = true; });
      }

      if (!id) { liste(); return; }
      const d = NT.store.find('demandes', id);
      if (d && (estAgent || d.userId === u.id)) { detail(d); return; }
      // Inexistante ou appartenant à quelqu'un d'autre : même message, on ne révèle pas son existence
      $('#titre-suivi').textContent = (d || !estAgent) ? bi('Accès refusé', 'Access denied') : bi('Demande introuvable', 'Request not found');
      $('#intro-suivi').textContent = '';
      zone.innerHTML = `<div class="vide" role="alert"><i class="ph-duotone ph-lock-key" aria-hidden="true" style="font-size:2.5rem;color:var(--corail)"></i>
        <p>${echap((d || !estAgent) ? bi('Vous ne pouvez consulter que vos propres demandes.', 'You can only view your own requests.') : bi('Aucune demande ne correspond à ce numéro.', 'No request matches this number.'))}</p>
        <a class="btn btn-primaire" href="${estAgent ? 'agent-demandes.html' : 'espace.html'}">${echap(estAgent ? bi('Retour aux demandes', 'Back to requests') : bi('Retour à mon espace', 'Back to my space'))}</a>
        <a class="btn" href="suivi.html">${echap(bi('Voir mes demandes', 'See my requests'))}</a></div>`;
    });
  </script>
</body>
</html>
