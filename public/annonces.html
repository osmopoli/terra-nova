<html lang="fr" class="sl-theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <title>Annonces et alertes — Terra Nova</title>
  <meta name="description" content="Annonces de la mairie de Terra Nova, informations pratiques et alertes en cours avec les consignes à suivre.">
  <meta name="theme-color" content="#0b1a1c">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" id="nt-polices" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" media="print" onload="if(!document.documentElement.classList.contains('leger'))this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/annonces.css">
  <script src="assets/js/i18n.js"></script>

  <script src="assets/js/ui.js" defer></script>
</head>
<body data-page="annonces" data-ariane="nav.accueil|index.html;nav.annonces" data-roles="">
  <main id="contenu" class="conteneur">

    <header class="titre-page">
      <h1 data-i18n="an.titre">Annonces et alertes</h1>
      <p data-i18n="an.intro">Les informations de la mairie, les changements de service et les alertes en cours. Les alertes passent toujours en premier, avec ce qu’il faut faire.</p>
    </header>

    <!-- F73 : message officiel du Haut Conseil épinglé en tête des annonces tant qu'il est en cours -->
    <section id="nt-officiel-epingle" class="off-epingle-zone" hidden></section>

    <div class="an-mise">
      <div class="an-principal">
        <!-- D06 : retrouver facilement les publications -->
        <section class="an-outils" aria-labelledby="an-lbl-rech">
          <form class="an-recherche" role="search" id="an-form">
            <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
            <label for="an-q" id="an-lbl-rech" class="sr-only" data-i18n="an.rechercheLabel">Rechercher dans les annonces</label>
            <input id="an-q" type="search" autocomplete="off" aria-describedby="an-compteur" data-i18n-attr="placeholder:an.recherchePh" placeholder="Eau, mairie, collecte, chaleur…">
          </form>
          <div class="an-filtres" role="group" aria-labelledby="an-lbl-filtres">
            <span id="an-lbl-filtres" data-i18n="an.filtrer">Catégorie :</span>
            <span id="an-boutons" class="an-boutons"></span>
          </div>
          <p class="an-compteur" id="an-compteur" role="status" aria-live="polite"></p>
        </section>
        <div id="an-liste"></div>
      </div>

      <!-- F30 : être prévenu -->
      <aside class="an-prevenir" aria-labelledby="an-h-prevenir" id="an-prevenir"></aside>
    </div>
  </main>

        'an.cat.alerte': 'Alertas', 'an.cat.sanitaire': 'Salud', 'an.cat.municipale': 'Ayuntamiento', 'an.cat.pratique': 'Práctico',

        'an.quefaire': '¿Qué hacer?', 'an.publics': 'Personas a proteger en prioridad', 'an.lieux': 'Dónde refrescarse', 'an.urgences': 'Números de emergencia', 'an.n112': 'Emergencias', 'an.n15': 'Urgencia médica', 'an.appeler': 'Llamar al {n}',
        'an.lire': 'Leer el anuncio completo', 'an.aucune': 'Ningún anuncio coincide con su búsqueda.',

        'an.enregistrer': 'Guardar mis preferencias', 'an.enregistre': 'Preferencias guardadas.', 'an.tester': 'Recibir una notificación de prueba',

        'an.lNote': 'La mediateca está cerrada por mantenimiento.', 'an.prevPoint': 'Las alertas también están visibles en todo momento gracias a la baliza «Alertas» en la parte superior de la página.',

      },
      ar: {
        'an.titre': 'الإعلانات والتنبيهات', 'an.intro': 'أخبار البلدية وتغييرات الخدمات والتنبيهات الجارية. التنبيهات أولاً دائماً مع ما يجب فعله.',
        'an.rechercheLabel': 'البحث في الإعلانات', 'an.recherchePh': 'الماء، البلدية، الجمع، الحر…', 'an.filtrer': 'الفئة:', 'an.toutes': 'الكل',
        'an.cat.alerte': 'تنبيهات', 'an.cat.sanitaire': 'الصحة', 'an.cat.municipale': 'البلدية', 'an.cat.pratique': 'عملي',

        'an.prevH': 'كن على علم', 'an.seConnecter': 'تسجيل الدخول', 'an.enregistrer': 'حفظ تفضيلاتي', 'an.enregistre': 'تم حفظ التفضيلات.',
        'an.nb0': 'لا يوجد إعلان مطابق.', 'an.nb1': 'إعلان واحد معروض.', 'an.nbN': '{n} إعلانات معروضة.', 'an.archivesTitre': 'إعلانات منتهية', 'an.terminee': 'منتهٍ',

        'an.publics': 'أشخاص تجب حمايتهم أولاً', 'an.vous': 'أنت معنيّ بالأولوية', 'an.vousTexte': 'يشير ملفك إلى وضع هش. اتبع هذه التعليمات فوراً، وأخبر أحد أقاربك، واتصل بالرقم 15 عند أي وعكة.',

        'an.prevIntro': 'الإعلانات المهمة والتنبيهات تُطلق إشعاراً في الجرس ورسالة على الشاشة عند زيارتك القادمة.',
        'an.prevVisiteur': 'سجّل الدخول لاختيار ما تريد استلامه ولتلقي تنبيهات حيّك فقط.', 'an.creerCompte': 'إنشاء حساب',
        'an.prevPoint': 'التنبيهات مرئية أيضاً في أي وقت بفضل شارة «التنبيهات» أعلى الصفحة.', 'an.prevLegende': 'ما الإعلانات التي تريد استلامها؟',
        'an.alerteToujours': 'تنبيهات السلامة (تُرسل دائماً)', 'an.quartierSeul': 'تنبيهات حيّي فقط ({q})',
        'an.tester': 'تلقي إشعار تجريبي', 'an.testTitre': 'إشعار تجريبي', 'an.testTexte': 'هكذا سيتم إخطارك بإعلان مهم.', 'an.testToast': 'تم إرسال الإشعار التجريبي: تجده في الجرس.'
      }
    });

    NT.pret(() => {
      const { echap } = NT.ui, t = NT.t;
      const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
      const u = NT.auth.utilisateur();
      const CATS = ['alerte', 'sanitaire', 'municipale', 'pratique'];
      const catLib = c => { c = c || 'municipale'; return t('an.cat.' + c, null, c); };
      const champ = document.getElementById('an-q'), boutons = document.getElementById('an-boutons'), liste = document.getElementById('an-liste'), compteur = document.getElementById('an-compteur');
      let categorie = '';
      const ouverts = new Set();
      let cible = (location.hash || '').replace(/^#/, '');

      const maintenant = () => new Date().toISOString();
      const estAlerteActive = a => a.active && a.importance === 'alerte' && (!a.expire || a.expire > maintenant());
      const estActive = a => a.active && (!a.expire || a.expire > maintenant());
      const poids = a => (estAlerteActive(a) ? 0 : estActive(a) ? (a.importance === 'importante' ? 1 : 2) : 3);

      function texteRech(a) {
        return norm([a.titre, a.resume, a.contenu, a.zone, (a.consignes || []).join(' '), (a.publics || []).join(' '), catLib(a.categorie), a.categorie].join(' | '));
      }
      function filtrees() {
        const mots = norm(champ.value).split(/\s+/).filter(Boolean);
        return NT.annonces.toutes().filter(a => (!categorie || a.categorie === categorie) && (!mots.length || (() => { const x = texteRech(a); return mots.every(m => x.includes(m)); })()))
          .sort((a, b) => (poids(a) - poids(b)) || b.cree.localeCompare(a.cree));
      }

      /* Numéros utiles et lieux frais selon la nature de l'annonce (F29, F31) */
      function urgences(a) {
        const l = [['112', 'an.n112']];
        if (a.categorie === 'sanitaire' || /malaise|santé/i.test((a.consignes || []).join(' '))) l.push(['15', 'an.n15']);
        return l;
      }
      const parleDeFraicheur = a => /climatis/i.test((a.consignes || []).join(' '));

      function concerne(a) {
        if (!u || u.role !== 'citoyen') return '';
        if (a.zone === 'Toute la ville') return `<span class="an-chip an-oui"><i class="ph ph-map-pin-area" aria-hidden="true"></i>${echap(t('an.concerne'))}</span>`;
        return a.zone === u.quartier
          ? `<span class="an-chip an-oui"><i class="ph ph-map-pin-area" aria-hidden="true"></i>${echap(t('an.concerne'))}</span>`
          : `<span class="an-chip"><i class="ph ph-map-pin" aria-hidden="true"></i>${echap(t('an.pasConcerne', { q: u.quartier }))}</span>`;
      }

      function meta(a) {
        const zone = a.zone === 'Toute la ville' ? t('an.zoneToute') : a.zone;
        return `<p class="an-meta"><span><i class="ph ph-map-pin" aria-hidden="true"></i><span class="sr-only">${echap(t('an.zone'))} : </span>${echap(zone)}</span>
          <span><i class="ph ph-clock" aria-hidden="true"></i>${echap(t('an.depuis'))} <time datetime="${echap(a.cree)}" title="${echap(NT.ui.dateHeure(a.cree))}">${echap(NT.ui.depuis(a.cree))}</time></span>
          <span class="an-chip an-cat">${echap(catLib(a.categorie))}</span>${concerne(a)}</p>`;
      }

      function niveau(a) {
        const code = !estActive(a) ? 'fin' : a.importance;
        const ico = code === 'alerte' ? 'ph-warning-octagon' : code === 'importante' ? 'ph-megaphone' : code === 'fin' ? 'ph-archive' : 'ph-info';
        const lib = code === 'fin' ? t('an.terminee') : t('an.niveau.' + a.importance, null, a.importance);
        return `<span class="an-niveau an-niv-${code}"><i class="ph-duotone ${ico}" aria-hidden="true"></i>${echap(lib)}</span>`;
      }

      function carteAlerte(a) {
        const publics = a.publics && a.publics.length;
        const vulnerable = publics && u && u.vulnerable;
        return `<article class="an an-alerte" id="${echap(a.id)}" tabindex="-1" aria-labelledby="t-${echap(a.id)}">
          <header>${niveau(a)}<h3 id="t-${echap(a.id)}">${echap(a.titre)}</h3></header>
          ${meta(a)}
          ${vulnerable ? `<div class="an-vous" role="note"><i class="ph-duotone ph-user-focus" aria-hidden="true"></i><div><strong>${echap(t('an.vous'))}</strong><p>${echap(t('an.vousTexte'))}</p></div></div>` : ''}
          <p class="an-texte">${echap(a.contenu || a.resume || '')}</p>
          ${a.consignes && a.consignes.length ? `<h4>${echap(t('an.quefaire'))}</h4><ol class="an-consignes">${a.consignes.map(c => `<li>${echap(c)}</li>`).join('')}</ol>` : ''}
          ${publics ? `<h4>${echap(t('an.publics'))}</h4><ul class="an-publics">${a.publics.map(p => `<li><i class="ph-duotone ph-heartbeat" aria-hidden="true"></i>${echap(p)}</li>`).join('')}</ul>` : ''}
          ${parleDeFraicheur(a) ? `<h4>${echap(t('an.lieux'))}</h4><ul class="an-lieux">${[1, 2, 3, 4].map(i => `<li>${echap(t('an.l' + i))}</li>`).join('')}</ul><p class="doux an-petit">${echap(t('an.lNote'))}</p>` : ''}
          <h4>${echap(t('an.urgences'))}</h4>
          <ul class="an-urgences">${urgences(a).map(([n, k]) => `<li><a class="btn${n === '112' ? ' btn-danger' : ''}" href="tel:${n}" aria-label="${echap(t('an.appeler', { n }) + ' — ' + t(k))}"><i class="ph ph-phone" aria-hidden="true"></i><strong>${n}</strong> ${echap(t(k))}</a></li>`).join('')}</ul>
        </article>`;
      }

      function carteInfo(a) {
        const long = a.contenu && a.contenu.trim() && a.contenu.trim() !== (a.resume || '').trim();
        const plein = (a.consignes && a.consignes.length) || (a.publics && a.publics.length);
        const detaille = long || plein;
        const suite = detaille ? `<details class="an-suite" data-id="${echap(a.id)}"${ouverts.has(a.id) ? ' open' : ''}>
            <summary>${echap(t('an.lire'))}</summary>
            <div>${long ? `<p>${echap(a.contenu)}</p>` : ''}
            ${a.consignes && a.consignes.length ? `<h4>${echap(t('an.quefaire'))}</h4><ol class="an-consignes">${a.consignes.map(c => `<li>${echap(c)}</li>`).join('')}</ol>` : ''}</div></details>` : '';
        return `<article class="an an-info an-${estActive(a) ? a.importance : 'fin'}" id="${echap(a.id)}" tabindex="-1" aria-labelledby="t-${echap(a.id)}">
          <header>${niveau(a)}<h3 id="t-${echap(a.id)}">${echap(a.titre)}</h3></header>
          ${meta(a)}
          <p class="an-texte">${echap(a.resume || a.contenu || '')}</p>
          ${suite}
        </article>`;
      }

      function groupe(titre, id, items, fn, classe) {
        return items.length ? `<section class="an-groupe ${classe}" aria-labelledby="${id}"><h2 id="${id}">${echap(titre)}</h2>${items.map(fn).join('')}</section>` : '';
      }

      function boutonsHtml() {
        const cats = CATS.concat(Array.from(new Set(NT.annonces.toutes().map(a => a.categorie).filter(c => c && !CATS.includes(c)))));
        const b = (v, l) => `<button type="button" class="an-filtre" data-cat="${echap(v)}" aria-pressed="${categorie === v ? 'true' : 'false'}">${echap(l)}</button>`;
        boutons.innerHTML = b('', t('an.toutes')) + cats.map(c => b(c, catLib(c))).join('');
      }

      function rendre() {
        const l = filtrees();
        const alertes = l.filter(estAlerteActive), actives = l.filter(a => estActive(a) && !estAlerteActive(a)), archives = l.filter(a => !estActive(a));
        liste.innerHTML = l.length
          ? groupe(t('an.alertesTitre'), 'an-h-al', alertes, carteAlerte, 'an-g-alertes') + groupe(t('an.infosTitre'), 'an-h-inf', actives, carteInfo, 'an-g-infos') + groupe(t('an.archivesTitre'), 'an-h-arc', archives, carteInfo, 'an-g-arch')
          : `<p class="vide">${echap(t('an.aucune'))}</p>`;
        compteur.textContent = l.length === 0 ? t('an.nb0') : l.length === 1 ? t('an.nb1') : t('an.nbN', { n: l.length });
        marquerCible();
      }

      /* Arrivée par ancre (#ann-crue) : ouvre, surligne, place le focus */
      function marquerCible(defiler) {
        document.querySelectorAll('.an.cible').forEach(e => e.classList.remove('cible'));
        if (!cible) return;
        const el = document.getElementById(cible);
        if (!el || !el.classList.contains('an')) return;
        el.classList.add('cible');
        const det = el.querySelector('details'); if (det) { det.open = true; ouverts.add(det.dataset.id); }
        if (defiler) { el.scrollIntoView({ block: 'start' }); el.focus({ preventScroll: true }); }
      }
      function versAncre() {
        cible = decodeURIComponent((location.hash || '').replace(/^#/, ''));
        if (!cible) { marquerCible(); return; }
        if (!document.getElementById(cible)) {          // masqué par un filtre ? on les réinitialise
          const a = NT.annonces.toutes().find(x => x.id === cible);
          if (!a) return;
          champ.value = ''; categorie = ''; boutonsHtml(); rendre();
        }
        marquerCible(true);
      }

      /* ---------- F30 : être prévenu ---------- */
      function prevenir() {
        const zone = document.getElementById('an-prevenir');
        const tete = `<h2 id="an-h-prevenir"><i class="ph-duotone ph-bell-ringing" aria-hidden="true"></i>${echap(t('an.prevH'))}</h2><p>${echap(t('an.prevIntro'))}</p>`;
        if (!u) {
          zone.innerHTML = tete + `<p class="doux">${echap(t('an.prevVisiteur'))}</p>
            <div class="ligne"><a class="btn btn-primaire" href="connexion.html?retour=annonces.html">${echap(t('an.seConnecter'))}</a><a class="btn" href="inscription.html">${echap(t('an.creerCompte'))}</a></div>
            <p class="doux an-petit">${echap(t('an.prevPoint'))}</p>`;
          return;
        }
        const p = u.preferences || {};
        const choisies = Array.isArray(p.categories) ? p.categories : CATS;
        zone.innerHTML = tete + `<form id="an-prefs" novalidate>
          <fieldset><legend>${echap(t('an.prevLegende'))}</legend>
            <div class="an-case"><input type="checkbox" id="pf-alerte" checked disabled aria-describedby="pf-alerte-a"><label for="pf-alerte" id="pf-alerte-a">${echap(t('an.alerteToujours'))}</label></div>
            ${CATS.filter(c => c !== 'alerte').map(c => `<div class="an-case"><input type="checkbox" id="pf-${c}" value="${c}" ${choisies.includes(c) ? 'checked' : ''}><label for="pf-${c}">${echap(catLib(c))}</label></div>`).join('')}
          </fieldset>
          <div class="an-case an-case-q"><input type="checkbox" id="pf-quartier" ${p.quartierSeul ? 'checked' : ''}><label for="pf-quartier">${echap(t('an.quartierSeul', { q: u.quartier || '—' }))}</label></div>
          <div class="ligne an-prefs-actions"><button class="btn btn-primaire" type="submit">${echap(t('an.enregistrer'))}</button>
            <button class="btn" type="button" id="pf-test"><i class="ph ph-bell-simple" aria-hidden="true"></i>${echap(t('an.tester'))}</button></div>
        </form><p class="doux an-petit">${echap(t('an.prevPoint'))}</p>`;
        zone.querySelector('#an-prefs').addEventListener('submit', e => {
          e.preventDefault();
          const cats = CATS.filter(c => c !== 'alerte' && zone.querySelector('#pf-' + c).checked).concat('alerte');
          const prefs = Object.assign({}, (NT.auth.utilisateur() || {}).preferences, { categories: cats, quartierSeul: zone.querySelector('#pf-quartier').checked });
          NT.store.update('utilisateurs', u.id, { preferences: prefs });
          NT.ui.toast(t('an.enregistre'), 'success');
        });
        zone.querySelector('#pf-test').addEventListener('click', () => {
          NT.notif.ajouter(u.id, t('an.testTitre'), t('an.testTexte'), 'annonces.html', 'info');
          NT.ui.toast(t('an.testToast'), 'primary');
        });
      }

      /* ---------- Démarrage ---------- */
      boutonsHtml(); rendre(); prevenir();
      if (cible) marquerCible(true);
      champ.addEventListener('input', rendre);
      document.getElementById('an-form').addEventListener('submit', e => { e.preventDefault(); rendre(); });
      boutons.addEventListener('click', e => {
        const b = e.target.closest('[data-cat]'); if (!b) return;
        categorie = categorie === b.dataset.cat ? '' : b.dataset.cat;
        boutonsHtml(); rendre();
        const n = boutons.querySelector(`[data-cat="${CSS.escape(categorie)}"]`); if (n) n.focus();
      });
      liste.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-id]')) { d.open ? ouverts.add(d.dataset.id) : ouverts.delete(d.dataset.id); } }, true);
      window.addEventListener('hashchange', versAncre);
    });
  </script>
</body>
</html>
