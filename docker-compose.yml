# MySQL local pour le développement : docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-terranova}
      MYSQL_DATABASE: ${DB_NAME:-terranova}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-terranova}"]
      interval: 5s
      retries: 20
volumes:
  mysql-data:
